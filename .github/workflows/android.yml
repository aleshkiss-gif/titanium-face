name: Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent debug signing key
        id: signing-key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: titanium-face-debug-signing-v1
      - name: Verify signing identity is available
        env:
          SIGNING_KEY_BASE64: ${{ secrets.TITANIUM_SIGNING_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Using permanent signing identity from GitHub Secrets"
          elif [ "${{ steps.signing-key.outputs.cache-hit }}" = "true" ]; then
            echo "Using existing cached signing identity"
          else
            echo "::error::Signing identity missing. Refusing to generate a different key. Configure TITANIUM_SIGNING_KEY_BASE64 secret."
            exit 1
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Verify APK signing identity
        env:
          EXPECTED_SHA256: "197B775DA8D1B00776086E0FA5E61F6FE5C4EA14EBAEBC88AD25D6282D5AE269"
        run: |
          ACTUAL_SHA256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          echo "Actual signing certificate SHA256: ${ACTUAL_SHA256}"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Signing certificate differs from the approved APK. Build stopped to prevent incompatible updates."
            exit 1
          fi
          echo "Verified stable APK signing identity."
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Save signing key for future builds
        if: steps.signing-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: titanium-face-debug-signing-v1
      - name: Show signing certificate fingerprint
        run: keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256:|SHA1:'
      - uses: actions/upload-artifact@v4
        with:
          name: titanium-face-debug
          path: app/build/outputs/apk/debug/*.apk
