name: Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent signing key from GitHub Secrets
        env:
          SIGNING_KEY_BASE64: ${{ secrets.TITANIUM_SIGNING_KEY_BASE64 }}
          TITANIUM_SIGNING_STORE_PASSWORD: ${{ secrets.TITANIUM_SIGNING_STORE_PASSWORD }}
          TITANIUM_SIGNING_KEY_ALIAS: ${{ secrets.TITANIUM_SIGNING_KEY_ALIAS }}
          TITANIUM_SIGNING_KEY_PASSWORD: ${{ secrets.TITANIUM_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY_BASE64" ] || [ -z "$TITANIUM_SIGNING_STORE_PASSWORD" ] || [ -z "$TITANIUM_SIGNING_KEY_ALIAS" ] || [ -z "$TITANIUM_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Permanent signing secrets are missing. Configure all four TITANIUM_SIGNING_* secrets."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/titanium-signing"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/titanium-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/titanium-signing/release.jks"
          echo "TITANIUM_SIGNING_FILE=$RUNNER_TEMP/titanium-signing/release.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/titanium-signing/release.jks" -storepass "$TITANIUM_SIGNING_STORE_PASSWORD" -alias "$TITANIUM_SIGNING_KEY_ALIAS" >/dev/null
      - name: Build APK with permanent signing identity
        env:
          TITANIUM_SIGNING_STORE_PASSWORD: ${{ secrets.TITANIUM_SIGNING_STORE_PASSWORD }}
          TITANIUM_SIGNING_KEY_ALIAS: ${{ secrets.TITANIUM_SIGNING_KEY_ALIAS }}
          TITANIUM_SIGNING_KEY_PASSWORD: ${{ secrets.TITANIUM_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify final APK certificate
        env:
          EXPECTED_SHA256: "3A5117A7B9D350462644B98DA433EDEA268F4141781F9CA082029196BA966C93"
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          ACTUAL_SHA256="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          echo "Final APK certificate SHA256: $ACTUAL_SHA256"
          if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Final APK does not use permanent approved certificate."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: titanium-face-debug
          path: app/build/outputs/apk/debug/*.apk
